<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nistula · Webhook Test Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #0b0d0f;
  --bg2:     #111417;
  --bg3:     #181c20;
  --bg4:     #1e2228;
  --border:  #262c34;
  --border2: #1c2028;
  --text:    #dde3ec;
  --dim:     #5a6a7a;
  --muted:   #2a333d;
  --green:   #34d399;
  --green-bg:#0d2b20;
  --red:     #f87171;
  --red-bg:  #2b0d0d;
  --yellow:  #fbbf24;
  --yellow-bg:#2b2208;
  --blue:    #60a5fa;
  --blue-bg: #0d1a2b;
  --purple:  #c084fc;
  --purple-bg:#1e0d2b;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'IBM Plex Sans', sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh}

/* ── Header ── */
header{
  position:sticky;top:0;z-index:200;
  background:var(--bg);border-bottom:1px solid var(--border);
  padding:14px 28px;
  display:flex;align-items:center;gap:20px;
}
.logo{
  font-family:var(--mono);font-size:13px;font-weight:600;
  color:var(--text);letter-spacing:0.04em;white-space:nowrap;
}
.logo span{color:var(--dim);font-weight:300}

.stats-row{display:flex;gap:2px;align-items:center;flex:1}
.stat-pill{
  display:flex;align-items:center;gap:7px;
  padding:5px 12px;border-radius:4px;
  font-family:var(--mono);font-size:11px;
}
.stat-num{font-size:18px;font-weight:600;line-height:1}
.stat-label{color:var(--dim);font-size:10px}
.s-total{color:var(--text)}
.s-pass .stat-num{color:var(--green)}
.s-fail .stat-num{color:var(--red)}
.s-notrun .stat-num{color:var(--dim)}

.header-right{display:flex;align-items:center;gap:10px;margin-left:auto}

/* ── Controls ── */
.controls{
  padding:10px 28px;
  border-bottom:1px solid var(--border2);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--bg2);
}
.url-field{
  background:var(--bg3);border:1px solid var(--border);
  color:var(--text);font-family:var(--mono);font-size:12px;
  padding:6px 10px;border-radius:4px;width:210px;
}
.url-field:focus{outline:1px solid var(--blue);border-color:var(--blue)}

.tabs{display:flex;gap:3px}
.tab{
  padding:5px 12px;border-radius:4px;border:1px solid transparent;
  background:transparent;color:var(--dim);
  font-family:var(--sans);font-size:12px;cursor:pointer;transition:all .15s;
}
.tab:hover{color:var(--text);border-color:var(--border)}
.tab.active{background:var(--bg4);color:var(--text);border-color:var(--border)}

.btn{
  padding:6px 16px;border-radius:4px;border:none;
  font-family:var(--sans);font-size:12px;font-weight:500;cursor:pointer;
  transition:opacity .15s;
}
.btn-primary{background:var(--blue);color:#000}
.btn-primary:hover{opacity:.85}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
.btn-ghost{background:var(--bg4);color:var(--dim);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text)}

/* ── Progress bar ── */
.progress-bar{height:2px;background:var(--border2)}
.progress-fill{height:100%;background:var(--blue);transition:width .25s;width:0%}

/* ── CORS notice ── */
.notice{
  margin:12px 28px 0;
  background:var(--yellow-bg);border:1px solid #3a2a08;
  border-radius:4px;padding:9px 14px;
  display:flex;align-items:flex-start;gap:10px;
}
.notice-icon{font-size:13px;margin-top:1px;flex-shrink:0}
.notice-text{font-size:12px;color:var(--yellow);line-height:1.6;font-family:var(--mono)}
.notice-text code{
  background:rgba(251,191,36,.15);padding:1px 5px;border-radius:2px;
}
.notice.hidden{display:none}

/* ── Test list ── */
.test-list{padding:14px 28px 40px;display:flex;flex-direction:column;gap:6px;max-width:1060px}

/* ── Card ── */
.card{
  border:1px solid var(--border2);border-radius:6px;
  overflow:hidden;transition:border-color .15s;
}
.card.pass  {border-left:3px solid var(--green);border-left-color:var(--green)}
.card.fail  {border-left:3px solid var(--red)}
.card.running{border-left:3px solid var(--blue)}
.card.notrun{border-left:3px solid var(--border)}

.card-header{
  background:var(--bg2);
  padding:11px 14px;
  display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none;
}
.card-header:hover{background:var(--bg3)}

.card-num{
  font-family:var(--mono);font-size:10px;color:var(--muted);
  width:22px;text-align:right;flex-shrink:0;
}

.card-name{font-size:13px;font-weight:500;flex:1;line-height:1.3}

.cat-badge{
  font-size:9px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;
  padding:2px 8px;border-radius:999px;flex-shrink:0;
}
.cat-happy   {background:rgba(52,211,153,.1);color:var(--green)}
.cat-known   {background:rgba(251,191,36,.1);color:var(--yellow)}
.cat-edge    {background:rgba(96,165,250,.1);color:var(--blue)}
.cat-security{background:rgba(192,132,252,.1);color:var(--purple)}

.card-status{
  font-family:var(--mono);font-size:11px;width:58px;text-align:right;flex-shrink:0;
}
.st-pass   {color:var(--green)}
.st-fail   {color:var(--red)}
.st-running{color:var(--blue)}
.st-notrun {color:var(--muted)}

.card-run-btn{
  padding:4px 10px;background:var(--bg4);color:var(--dim);
  border:1px solid var(--border);border-radius:3px;
  font-size:11px;font-family:var(--mono);cursor:pointer;flex-shrink:0;
  transition:all .15s;
}
.card-run-btn:hover{color:var(--text);border-color:var(--blue)}
.card-run-btn:disabled{opacity:.35;cursor:not-allowed}

/* ── Card body ── */
.card-body{border-top:1px solid var(--border2);display:none;flex-direction:column;gap:14px;padding:14px}
.card-body.open{display:flex}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:680px){.row2{grid-template-columns:1fr}}

.section-label{
  font-family:var(--mono);font-size:9px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;
}

.expect-chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{
  font-family:var(--mono);font-size:10px;
  padding:2px 8px;border-radius:3px;
  background:var(--bg4);border:1px solid var(--border);
  color:var(--dim);
}
.chip .ck{color:var(--muted);margin-right:4px}
.chip .cv{color:var(--text)}

.code-box{
  background:var(--bg);border:1px solid var(--border2);border-radius:4px;
  padding:10px;font-family:var(--mono);font-size:11px;line-height:1.6;
  overflow:auto;max-height:190px;white-space:pre;color:var(--text);
}

.check-list{display:flex;flex-direction:column;gap:3px}
.check-item{display:flex;align-items:baseline;gap:7px;font-family:var(--mono);font-size:11px}
.ci-icon{flex-shrink:0;width:12px}
.ci-ok  .ci-icon{color:var(--green)}
.ci-fail.ci-icon{color:var(--red)}
.ci-label{flex:1}
.ci-detail{color:var(--dim);font-size:10px}

.drafted-box{
  background:var(--bg);border:1px solid var(--border2);border-radius:4px;
  padding:10px 12px;font-size:12px;line-height:1.7;color:var(--text);
  max-height:130px;overflow:auto;white-space:pre-wrap;
}

.net-error{
  background:var(--red-bg);border:1px solid #3d1010;border-radius:4px;
  padding:10px 12px;font-family:var(--mono);font-size:11px;color:var(--red);
}

.curl-row{display:flex;align-items:center;gap:8px}
.copy-btn{
  padding:3px 9px;background:transparent;color:var(--dim);
  border:1px solid var(--border);border-radius:3px;
  font-size:10px;font-family:var(--mono);cursor:pointer;transition:all .15s;
}
.copy-btn:hover{color:var(--text)}
.copy-ok{font-size:10px;color:var(--green);font-family:var(--mono);opacity:0;transition:opacity .3s}

.known-issue-note{
  background:var(--yellow-bg);border:1px solid #3a2a08;border-radius:3px;
  padding:7px 10px;font-family:var(--mono);font-size:10px;color:var(--yellow);
}

.http-badge{
  font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:3px;
  display:inline-block;
}
.http-200{background:rgba(52,211,153,.12);color:var(--green)}
.http-422{background:rgba(192,132,252,.12);color:var(--purple)}
.http-err{background:rgba(248,113,113,.12);color:var(--red)}

/* spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{
  display:inline-block;width:10px;height:10px;
  border:1.5px solid var(--border);border-top-color:var(--blue);
  border-radius:50%;animation:spin .6s linear infinite;
}
</style>
</head>
<body>

<header>
  <div class="logo">nistula<span>/</span>webhook-tests</div>
  <div class="stats-row">
    <div class="stat-pill s-total">
      <div>
        <div class="stat-num" id="st-total">24</div>
        <div class="stat-label">total</div>
      </div>
    </div>
    <div class="stat-pill s-pass">
      <div>
        <div class="stat-num" id="st-pass">0</div>
        <div class="stat-label">pass</div>
      </div>
    </div>
    <div class="stat-pill s-fail">
      <div>
        <div class="stat-num" id="st-fail">0</div>
        <div class="stat-label">fail</div>
      </div>
    </div>
    <div class="stat-pill s-notrun">
      <div>
        <div class="stat-num" id="st-notrun">24</div>
        <div class="stat-label">not run</div>
      </div>
    </div>
  </div>
  <div class="header-right">
    <input class="url-field" id="base-url" value="http://localhost:8000" placeholder="http://localhost:8000">

</header>

<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

<div class="notice" id="cors-notice">
  <div class="notice-icon">⚠</div>
  <div class="notice-text">
    <strong>CORS:</strong> Add <code>CORSMiddleware</code> to FastAPI for browser tests to work.
    In <code>main.py</code>: <code>app.add_middleware(CORSMiddleware, allow_origins=["*"], allow_methods=["*"], allow_headers=["*"])</code>
    &nbsp;·&nbsp; Or use the <strong>curl commands</strong> in each card below.
    <button onclick="document.getElementById('cors-notice').classList.add('hidden')" style="background:none;border:none;color:var(--yellow);cursor:pointer;font-size:11px;margin-left:12px">dismiss</button>
  </div>
</div>

<div style="padding:12px 28px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
  <div class="tabs" id="filter-tabs">
    <button class="tab active" data-filter="all">All (24)</button>
    <button class="tab" data-filter="happy">Happy path (6)</button>
    <button class="tab" data-filter="known">Known issues (2)</button>
    <button class="tab" data-filter="edge">Edge cases (10)</button>
    <button class="tab" data-filter="security">Security (6)</button>
  </div>
  <button class="btn btn-primary" id="run-all-btn" style="margin-left:auto">▶ Run visible</button>
  <button class="btn btn-ghost" id="reset-btn">Reset</button>
</div>

<div class="test-list" id="test-list"></div>

<script>
// ──────────────────────────────────────────────
// Test definitions
// ──────────────────────────────────────────────
const TESTS = [
  {

  },
  {

    payload:{source:"direct",guest_name:"Sarah Mitchell",message:"What time can we check in? And what is the WiFi password?",timestamp:"2026-05-06T08:00:00Z",booking_ref:"NIS-2024-0942",property_id:"villa-b1"},

  },
  {
    id:4, name:"Complaint — hot water 3am", cat:"happy",
    payload:{source:"whatsapp",guest_name:"James Whitfield",message:"There is no hot water and we have guests arriving for breakfast in 4 hours. This is unacceptable. I want a refund for tonight.",timestamp:"2026-05-07T03:00:00Z",booking_ref:"NIS-2024-1002",property_id:"villa-b1"},
    expect:{query_type:"complaint",action:"escalate",conf_op:"<=",conf:0.6}
  },
  {
    id:5, name:"General enquiry — pets & parking", cat:"happy",
    payload:{source:"instagram",guest_name:"Anika Verma",message:"Do you allow pets? Is there parking at the villa?",timestamp:"2026-05-08T14:00:00Z"},
    expect:{query_type:"general_enquiry",action:"auto_send",conf_op:">=",conf:0.85}
  },
  {
    id:6, name:"Complaint — AC not working", cat:"happy",
    payload:{source:"airbnb",guest_name:"Monica Patel",message:"The AC is not working. This is terrible. I am very unhappy.",timestamp:"2026-05-08T22:00:00Z",booking_ref:"NIS-2024-0950",property_id:"villa-b1"},
    expect:{query_type:"complaint",action:"escalate",conf_op:"<=",conf:0.6}
  },
  {
    id:7, name:"[BUG] Special request — early check-in", cat:"known",
    knownIssue:"Classifier hits 'check-in' before 'early check-in'. Returns post_sales_checkin instead of special_request. Fix: check SPECIAL_REQUEST patterns before CHECKIN patterns.",
    payload:{source:"booking_com",guest_name:"Monica Patel",message:"Can we arrange an early check-in? We arrive at 10am.",timestamp:"2026-05-10T14:30:00Z",booking_ref:"NIS-2024-0950",property_id:"villa-b1"},
    expect:{query_type:"special_request",action:"auto_send",conf_op:">=",conf:0.75}
  },
  {
    id:8, name:"[BUG] Multi-intent — availability + pricing", cat:"known",
    knownIssue:"Classifier returns pre_sales_pricing (hits 'rate' first). Should be pre_sales_availability. Fix: check AVAILABILITY before PRICING in if-elif chain.",
    payload:{source:"whatsapp",guest_name:"Rahul Sharma",message:"Is the villa available from April 20 to 24? What is the rate for 2 adults?",timestamp:"2026-05-05T10:30:00Z",booking_ref:"NIS-2024-0891",property_id:"villa-b1"},
    expect:{query_type:"pre_sales_availability",action:"auto_send",conf_op:">=",conf:0.85}
  },
  {
    id:9, name:"Special request — airport transfer", cat:"edge",
    payload:{source:"whatsapp",guest_name:"Aditi Roy",message:"Can you arrange an airport pickup from GOA airport on April 20? We land at 1pm.",timestamp:"2026-05-09T12:00:00Z",booking_ref:"NIS-2024-0880",property_id:"villa-b1"},
    expect:{query_type:"special_request",action:"auto_send",conf_op:">=",conf:0.75}
  },
  {
    id:10, name:"Special request — chef booking", cat:"edge",
    payload:{source:"direct",guest_name:"Tom Bradley",message:"We'd like to book the chef for dinner on our last night. How far in advance must we confirm?",timestamp:"2026-05-09T15:00:00Z",booking_ref:"NIS-2024-0905",property_id:"villa-b1"},
    expect:{query_type:"special_request",action:"auto_send",conf_op:">=",conf:0.75}
  },
  {
    id:11, name:"No property_id — pre-sales inquiry", cat:"edge",
    payload:{source:"instagram",guest_name:"Vikram Mehta",message:"Hi, I am interested in booking. Is anything available in May?",timestamp:"2026-05-09T10:00:00Z"},
    expect:{query_type:"pre_sales_availability",action:"auto_send",conf_op:">=",conf:0.8}
  },
  {
    id:12, name:"Pricing — 6 guests (over base capacity)", cat:"edge",
    payload:{source:"whatsapp",guest_name:"Neha Kapoor",message:"What is the total cost for 6 adults for 5 nights in late April?",timestamp:"2026-05-09T09:00:00Z",property_id:"villa-b1"},
    expect:{query_type:"pre_sales_pricing",action:"auto_send",conf_op:">=",conf:0.85}
  },
  {
    id:13, name:"Late check-out request", cat:"edge",
    payload:{source:"booking_com",guest_name:"Liu Wei",message:"What is the latest check-out time? Can we request a late check-out?",timestamp:"2026-05-10T07:00:00Z",booking_ref:"NIS-2024-1010",property_id:"villa-b1"},
    expect:{query_type:"post_sales_checkin",action:"auto_send",conf_op:">=",conf:0.85}
  },
  {
    id:14, name:"Complaint — no refund mention", cat:"edge",
    payload:{source:"airbnb",guest_name:"Simon Clarke",message:"The pool filter looks dirty and the water is not clean. This is absolutely unacceptable for a luxury villa.",timestamp:"2026-05-10T16:00:00Z",booking_ref:"NIS-2024-1020",property_id:"villa-b1"},
    expect:{query_type:"complaint",action:"escalate",conf_op:"<=",conf:0.6}
  },
  {
    id:15, name:"Long multi-topic message", cat:"edge",
    payload:{source:"direct",guest_name:"Sarah Thompson",message:"Hi! We are 4 adults planning a trip to Goa in late April. Is the villa available April 20-24? What is the rate for 4 adults? Do you allow pets? And what are the check-in and check-out times? Thank you!",timestamp:"2026-05-10T14:00:00Z",property_id:"villa-b1"},
    expect:{action:"auto_send",http_status:200}
  },

    expect:{action:"escalate",not_contains:"50,000"}
  },
  {
    id:17, name:"Invalid source value (422 expected)", cat:"security",
    payload:{source:"telegram",guest_name:"Test User",message:"Hello",timestamp:"2026-05-10T12:00:00Z"},
    expect:{http_status:422}
  },
  {
    id:18, name:"Missing required field (422 expected)", cat:"security",
    payload:{source:"whatsapp",guest_name:"Test User",timestamp:"2026-05-10T12:00:00Z"},
    expect:{http_status:422}
  },
  {
    id:19, name:"Empty body (422 expected)", cat:"security",
    payload:{},
    expect:{http_status:422}
  },
  {
    id:20, name:"Invalid timestamp (422 expected)", cat:"security",
    payload:{source:"whatsapp",guest_name:"Test User",message:"Hello",timestamp:"not-a-date"},
    expect:{http_status:422}
  },
  {
    id:21, name:"All 5 sources accepted — WhatsApp", cat:"edge",
    payload:{source:"whatsapp",guest_name:"Test",message:"Is the villa available?",timestamp:"2026-05-05T10:00:00Z"},
    expect:{action:"auto_send",http_status:200}
  },
  {
    id:22, name:"All 5 sources accepted — Airbnb", cat:"edge",
    payload:{source:"airbnb",guest_name:"Test",message:"Is the villa available?",timestamp:"2026-05-05T10:00:00Z"},
    expect:{action:"auto_send",http_status:200}
  },
  {
    id:23, name:"Unique message_id per request", cat:"edge",
    payload:{source:"whatsapp",guest_name:"Rahul",message:"Is the villa available?",timestamp:"2026-05-05T10:00:00Z",property_id:"villa-b1"},
    expect:{unique_message_id:true}
  },
  {
    id:24, name:"Complaint reply must not promise refund", cat:"security",
    payload:{source:"whatsapp",guest_name:"Angry Guest",message:"This is unacceptable. The power is out. I want a full refund right now.",timestamp:"2026-05-10T02:00:00Z",property_id:"villa-b1"},
    expect:{query_type:"complaint",action:"escalate",not_contains:"you will receive a refund"}
  }
];

// ──────────────────────────────────────────────
// State
// ──────────────────────────────────────────────
const results = {}; // id → {state:'pass'|'fail'|'running'|'notrun', checks, raw, error}
let currentFilter = 'all';
let runningAll = false;

// ──────────────────────────────────────────────
// Curl helper
// ──────────────────────────────────────────────
function buildCurl(test) {
  const url = `${document.getElementById('base-url').value}/webhook/message`;
  return `curl -X POST ${url} \\\n  -H "Content-Type: application/json" \\\n  -d '${JSON.stringify(test.payload, null, 2)}'`;
}

// ──────────────────────────────────────────────
// Test runner
// ──────────────────────────────────────────────
async function runTest(test) {
  const baseUrl = document.getElementById('base-url').value.replace(/\/$/, '');
  const url = `${baseUrl}/webhook/message`;

  // ── Unique message_id: fire twice, compare ──
  if (test.expect.unique_message_id) {
    try {
      const opts = {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(test.payload)};
      const [r1, r2] = await Promise.all([fetch(url, opts), fetch(url, opts)]);
      const [j1, j2] = await Promise.all([r1.json(), r2.json()]);
      const unique = j1.message_id !== j2.message_id;
      const checks = [{label:`Two message_ids are different`, pass:unique, detail:`${j1.message_id} ≠ ${j2.message_id}`}];
      return {pass:checks.every(c=>c.pass), checks, raw:{first:j1, second:j2}};
    } catch(e) {
      return {pass:false, checks:[], error:`Network error: ${e.message}`};
    }
  }

  // ── Normal test ──
  let response, status, data;
  try {
    response = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(test.payload)
    });
    status = response.status;
    try { data = await response.json(); } catch(_) { data = null; }
  } catch(e) {
    return {pass:false, checks:[], error:`Network error: ${e.message}. Check CORS middleware is enabled.`};
  }

  const checks = [];

  // HTTP status
  const expectedStatus = test.expect.http_status ?? 200;
  const statusPass = status === expectedStatus;
  checks.push({label:`HTTP ${expectedStatus}`, pass:statusPass, detail:`got ${status}`});

  // If we expected a non-200, stop here
  if (expectedStatus !== 200) {
    return {pass:checks.every(c=>c.pass), checks, raw:data, status};
  }

  if (!data) {
    checks.push({label:`Response is valid JSON`, pass:false, detail:`could not parse body`});
    return {pass:false, checks, status};
  }

  // message_id present
  checks.push({label:`message_id present`, pass:!!data.message_id, detail:data.message_id ?? 'missing'});

  // query_type
  if (test.expect.query_type) {
    const pass = data.query_type === test.expect.query_type;
    checks.push({label:`query_type = ${test.expect.query_type}`, pass, detail:`got: ${data.query_type}`});
  }

  // action
  if (test.expect.action) {
    const pass = data.action === test.expect.action;
    checks.push({label:`action = ${test.expect.action}`, pass, detail:`got: ${data.action}`});
  }

  // confidence
  if (test.expect.conf !== undefined) {
    const score = data.confidence_score;
    const op = test.expect.conf_op;
    const pass = op === '>=' ? score >= test.expect.conf : score <= test.expect.conf;
    checks.push({label:`confidence ${op} ${test.expect.conf}`, pass, detail:`got: ${score}`});
  }

  // not_contains (security guardrail)
  if (test.expect.not_contains) {
    const reply = (data.drafted_reply ?? '').toLowerCase();
    const forbidden = test.expect.not_contains.toLowerCase();
    const pass = !reply.includes(forbidden);
    checks.push({
      label: `drafted_reply must NOT contain "${test.expect.not_contains}"`,
      pass,
      detail: pass ? 'not found ✓' : '⚠ FOUND in reply!'
    });
  }

  return {pass:checks.every(c=>c.pass), checks, raw:data, status};
}

// ──────────────────────────────────────────────
// DOM helpers
// ──────────────────────────────────────────────
function catClass(cat) {
  return {happy:'cat-happy',known:'cat-known',edge:'cat-edge',security:'cat-security'}[cat] ?? '';
}
function catLabel(cat) {
  return {happy:'Happy path',known:'Known issue',edge:'Edge case',security:'Security'}[cat] ?? cat;
}

function expectChips(test) {
  const e = test.expect;
  const chips = [];
  if (e.query_type)  chips.push(`<span class="chip"><span class="ck">query</span><span class="cv">${e.query_type}</span></span>`);
  if (e.action)      chips.push(`<span class="chip"><span class="ck">action</span><span class="cv">${e.action}</span></span>`);
  if (e.conf !== undefined) chips.push(`<span class="chip"><span class="ck">conf</span><span class="cv">${e.conf_op}${e.conf}</span></span>`);
  if (e.http_status) chips.push(`<span class="chip"><span class="ck">HTTP</span><span class="cv">${e.http_status}</span></span>`);
  if (e.not_contains) chips.push(`<span class="chip"><span class="ck">no</span><span class="cv">"${e.not_contains}"</span></span>`);
  if (e.unique_message_id) chips.push(`<span class="chip"><span class="cv">unique message_id</span></span>`);
  return chips.join('');
}

function renderCard(test) {
  const res = results[test.id] ?? {state:'notrun'};
  const stateClass = res.state;
  const statusText = {notrun:'—', running:'...', pass:'PASS', fail:'FAIL'}[res.state];
  const statusCls  = {notrun:'st-notrun', running:'st-running', pass:'st-pass', fail:'st-fail'}[res.state];

  const bodyOpen = (res.state !== 'notrun') ? 'open' : '';

  let resultHtml = '';
  if (res.error) {
    resultHtml = `<div class="net-error">⚠ ${res.error}</div>`;
  } else if (res.checks && res.checks.length) {
    const items = res.checks.map(c => {
      const icon = c.pass ? '✓' : '✗';
      const cls  = c.pass ? 'ci-ok' : 'ci-fail';
      return `<div class="check-item ${cls}">
        <span class="ci-icon">${icon}</span>
        <span class="ci-label">${c.label}</span>
        <span class="ci-detail">${c.detail ?? ''}</span>
      </div>`;
    }).join('');
    resultHtml = `<div class="check-list">${items}</div>`;
  }

  let rawHtml = '';
  if (res.raw) {
    const display = typeof res.raw === 'object' ? JSON.stringify(res.raw, null, 2) : res.raw;
    rawHtml = `<div>
      <div class="section-label">Response</div>
      <div class="code-box">${escHtml(display)}</div>
    </div>`;
    if (res.raw.drafted_reply) {
      rawHtml += `<div>
        <div class="section-label">Drafted reply</div>
        <div class="drafted-box">${escHtml(res.raw.drafted_reply)}</div>
      </div>`;
    }
  }

  const curlCmd = buildCurl(test);
  const knownIssueHtml = test.knownIssue
    ? `<div class="known-issue-note">⚠ ${escHtml(test.knownIssue)}</div>`
    : '';

  return `
  <div class="card ${stateClass}" id="card-${test.id}" data-cat="${test.cat}">
    <div class="card-header" onclick="toggleCard(${test.id})">
      <span class="card-num">#${test.id}</span>
      <span class="card-name">${escHtml(test.name)}</span>
      <span class="cat-badge ${catClass(test.cat)}">${catLabel(test.cat)}</span>
      <span class="card-status ${statusCls}" id="status-${test.id}">${statusText}</span>
      <button class="card-run-btn" id="run-${test.id}" onclick="event.stopPropagation();runSingle(${test.id})">Run</button>
    </div>
    <div class="card-body ${bodyOpen}" id="body-${test.id}">
      ${knownIssueHtml}
      <div>
        <div class="section-label">Expected</div>
        <div class="expect-chips">${expectChips(test)}</div>
      </div>
      <div class="row2">
        <div>
          <div class="section-label">Payload</div>
          <div class="code-box">${escHtml(JSON.stringify(test.payload, null, 2))}</div>
        </div>
        <div>
          <div class="section-label">Curl</div>
          <div class="code-box" style="position:relative" id="curl-${test.id}">${escHtml(curlCmd)}</div>
          <div class="curl-row" style="margin-top:6px">
            <button class="copy-btn" onclick="copyCurl(${test.id})">Copy curl</button>
            <span class="copy-ok" id="copyok-${test.id}">Copied!</span>
          </div>
        </div>
      </div>
      <div id="result-${test.id}">${resultHtml}</div>
      ${rawHtml ? `<div id="raw-${test.id}">${rawHtml}</div>` : `<div id="raw-${test.id}"></div>`}
    </div>
  </div>`;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toggleCard(id) {
  const body = document.getElementById(`body-${id}`);
  body.classList.toggle('open');
}

function copyCurl(id) {
  const test = TESTS.find(t => t.id === id);
  navigator.clipboard.writeText(buildCurl(test)).then(() => {
    const el = document.getElementById(`copyok-${id}`);
    el.style.opacity = '1';
    setTimeout(() => el.style.opacity = '0', 1800);
  });
}

// ──────────────────────────────────────────────
// Render all
// ──────────────────────────────────────────────
function renderAll() {
  const container = document.getElementById('test-list');
  const visible = TESTS.filter(t => currentFilter === 'all' || t.cat === currentFilter);
  container.innerHTML = visible.map(renderCard).join('');
  updateStats();
}

function updateStats() {
  const all = TESTS;
  let pass = 0, fail = 0, notrun = 0;
  all.forEach(t => {
    const r = results[t.id];
    if (!r || r.state === 'notrun') notrun++;
    else if (r.state === 'pass') pass++;
    else if (r.state === 'fail') fail++;
  });
  document.getElementById('st-pass').textContent   = pass;
  document.getElementById('st-fail').textContent   = fail;
  document.getElementById('st-notrun').textContent = notrun;
}

function updateCard(id) {
  const existing = document.getElementById(`card-${id}`);
  if (!existing) return; // not visible
  const test = TESTS.find(t => t.id === id);
  const res = results[id] ?? {state:'notrun'};

  // Update class
  existing.className = `card ${res.state}`;

  // Status text
  const statusText = {notrun:'—', running:'...', pass:'PASS', fail:'FAIL'}[res.state];
  const statusCls  = {notrun:'st-notrun', running:'st-running', pass:'st-pass', fail:'st-fail'}[res.state];
  const statusEl = document.getElementById(`status-${id}`);
  statusEl.textContent  = statusText;
  statusEl.className    = `card-status ${statusCls}`;

  // Result area
  const resultEl = document.getElementById(`result-${id}`);
  let resultHtml = '';
  if (res.error) {
    resultHtml = `<div class="net-error">⚠ ${res.error}</div>`;
  } else if (res.checks && res.checks.length) {
    const items = res.checks.map(c => {
      const icon = c.pass ? '✓' : '✗';
      const cls  = c.pass ? 'ci-ok' : 'ci-fail';
      return `<div class="check-item ${cls}">
        <span class="ci-icon">${icon}</span>
        <span class="ci-label">${escHtml(c.label)}</span>
        <span class="ci-detail">${escHtml(c.detail ?? '')}</span>
      </div>`;
    }).join('');
    resultHtml = `<div class="check-list">${items}</div>`;
  }
  resultEl.innerHTML = resultHtml;

  // Raw response
  const rawEl = document.getElementById(`raw-${id}`);
  let rawHtml = '';
  if (res.raw) {
    const display = typeof res.raw === 'object' ? JSON.stringify(res.raw, null, 2) : res.raw;
    rawHtml = `<div>
      <div class="section-label">Response</div>
      <div class="code-box">${escHtml(display)}</div>
    </div>`;
    if (res.raw.drafted_reply) {
      rawHtml += `<div>
        <div class="section-label">Drafted reply</div>
        <div class="drafted-box">${escHtml(res.raw.drafted_reply)}</div>
      </div>`;
    }
  }
  rawEl.innerHTML = rawHtml;

  // Open body if just ran
  if (res.state !== 'notrun') {
    document.getElementById(`body-${id}`).classList.add('open');
  }

  updateStats();
}

// ──────────────────────────────────────────────
// Run single
// ──────────────────────────────────────────────
async function runSingle(id) {
  const test = TESTS.find(t => t.id === id);
  const btn = document.getElementById(`run-${id}`);
  btn.disabled = true;
  btn.textContent = '...';

  results[id] = {state:'running'};
  updateCard(id);

  const outcome = await runTest(test);
  results[id] = {state: outcome.pass ? 'pass' : 'fail', ...outcome};
  updateCard(id);

  btn.disabled = false;
  btn.textContent = 'Run';
}

// ──────────────────────────────────────────────
// Run all visible
// ──────────────────────────────────────────────
document.getElementById('run-all-btn').addEventListener('click', async () => {
  if (runningAll) return;
  runningAll = true;
  const btn = document.getElementById('run-all-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Running…';

  const visible = TESTS.filter(t => currentFilter === 'all' || t.cat === currentFilter);
  const progress = document.getElementById('progress');

  for (let i = 0; i < visible.length; i++) {
    const test = visible[i];
    results[test.id] = {state:'running'};
    updateCard(test.id);

    const outcome = await runTest(test);
    results[test.id] = {state: outcome.pass ? 'pass' : 'fail', ...outcome};
    updateCard(test.id);

    progress.style.width = `${((i + 1) / visible.length) * 100}%`;
  }

  setTimeout(() => { progress.style.width = '0%'; }, 1500);
  btn.disabled = false;
  btn.textContent = `▶ Run visible (${visible.length})`;
  runningAll = false;
});

// Reset
document.getElementById('reset-btn').addEventListener('click', () => {
  TESTS.forEach(t => { delete results[t.id]; });
  renderAll();
});

// Filter tabs
document.getElementById('filter-tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  currentFilter = tab.dataset.filter;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');

  // Update run btn label
  const visible = TESTS.filter(t => currentFilter === 'all' || t.cat === currentFilter);
  document.getElementById('run-all-btn').textContent = `▶ Run visible (${visible.length})`;

  renderAll();
});

// Initial render
renderAll();
</script>
</body>
</html>
